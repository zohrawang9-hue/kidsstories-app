# Codemagic 云打包配置 —— 圣人故事儿童集 iOS
# 流程：拉代码 → npm install → Capacitor 同步 iOS → 自动签名 → 打 IPA 包 → 上传 TestFlight
# 前置条件（在 Codemagic 网页上做一次）：
#  1. 用 GitHub 登录后 Add application，选中 zohrawang9-hue/kidsstories-app
#  2. App Store Connect → Users and Access → Integrations → App Store Connect API → Team Keys
#     生成一把 App Manager 角色的 Key，记下 Issuer ID、Key ID，并下载 .p8 文件（只可下载一次）
#  3. 在 Codemagic 的 Team settings → Integrations → App Store Connect API keys 里
#     Add key：Name 填 kidsstories_asc（必须和本文件 integrations.app_store_connect 一致），
#     填入 Issuer ID、Key ID，上传对应的 .p8 文件
#  4. 在 developer.apple.com 注册 App ID：ca.zohra.studio.kidsstories（Explicit）
#  5. 在 App Store Connect 建 App 记录（My Apps → + → New App），Bundle ID 选上面的
#  6. 在 Codemagic 里打开 kidsstories-app 这个应用自己的设置 → Environment variables，
#     新建变量组 ios_signing，加一个 Secure 变量 CERTIFICATE_PRIVATE_KEY，
#     内容是本机 .secrets/ios_distribution_private_key.pem 的全文（证书私钥，勿提交到 git）
workflows:
  ios-testflight:
    name: iOS TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # 引用 Codemagic 里配置好的 App Store Connect API 集成（名字必须和 UI 里填的一致）
    integrations:
      app_store_connect: kidsstories_asc
    environment:
      node: 20
      xcode: latest
      cocoapods: default
      groups:
        - ios_signing
      vars:
        BUNDLE_ID: ca.zohra.studio.kidsstories
    scripts:
      - name: Install npm dependencies
        script: |
          npm install
      - name: Sync Capacitor iOS project
        script: |
          npx cap sync ios
      - name: Fetch signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
      - name: Add signing certificates to keychain
        script: |
          keychain add-certificates
      - name: Set up code signing settings
        script: |
          xcode-project use-profiles
      - name: Diagnose signing setup
        script: |
          echo "=== codesigning identities in keychain:"
          security find-identity -v -p codesigning 2>&1 | head -20 || true
          echo "=== provisioning profiles:"
          ls ~/Library/MobileDevice/Provisioning\ Profiles/ 2>&1 || true
      # 注意：这里故意用原始 xcodebuild 而不是 xcode-project build-ipa，
      # 因为后者的美化输出会把真正的报错藏起来（只显示 "Failed to archive"）。
      - name: Build IPA for distribution
        script: |
          set +e
          # 用官方工具打包（自动处理签名和导出）。如果失败，自动跑原始 xcodebuild 抓出真正的报错。
          xcode-project build-ipa --workspace ios/App/App.xcworkspace --scheme App > /tmp/build_ipa.log 2>&1
          IPA_CODE=$?
          tail -20 /tmp/build_ipa.log
          if [ "$IPA_CODE" -ne 0 ]; then
            echo "=== build-ipa failed (code $IPA_CODE), running raw xcodebuild for full error output ==="
            xcodebuild -workspace ios/App/App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$PWD/build/App.xcarchive" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGN_STYLE=Manual \
              CODE_SIGN_IDENTITY='Apple Distribution' \
              DEVELOPMENT_TEAM=LRWKNYMQZJ \
              archive 2>&1 | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)|Build failed" | head -40 || true
            exit "$IPA_CODE"
          fi
          echo "=== IPA built successfully ==="
          find build/ios -name "*.ipa" 2>/dev/null || true
    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/*.ipa
      - /tmp/build_ipa.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
